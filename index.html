<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>五毛情绪铺</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#07070b;color:#f5f1e8;font-family:"Microsoft YaHei","PingFang SC",sans-serif}
  #photo{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;background-repeat:no-repeat;opacity:0;transition:opacity .9s ease;will-change:transform}
  #photo.on{opacity:1}
  #photo.kb{animation:kb 26s ease-in-out infinite alternate}
  @keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.11)}}
  #photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,4,8,.48) 0%,rgba(4,4,8,0) 32%,rgba(4,4,8,.12) 55%,rgba(4,4,8,.88) 100%)}
  body[data-scene="fireworks"] #photo::after{background:linear-gradient(180deg,rgba(4,4,8,.58) 0%,rgba(4,4,8,.04) 34%,rgba(4,4,8,.16) 56%,rgba(4,4,8,.86) 100%)}
  body[data-scene="snow"] #photo::after{background:linear-gradient(180deg,rgba(4,4,8,.34) 0%,rgba(4,4,8,0) 42%,rgba(4,4,8,.58) 100%)}
  #scene{position:fixed;inset:0;z-index:1;width:100%;height:100%;display:block;pointer-events:none}
  .brand{position:fixed;left:22px;top:18px;z-index:5;font-size:12px;letter-spacing:3px;color:rgba(245,241,232,.62);font-weight:700}
  .landing{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;justify-content:center;padding:0 26px;background:radial-gradient(120% 80% at 50% 0%,rgba(38,28,60,.55),rgba(7,7,11,.25) 55%,rgba(7,7,11,.94));transition:opacity .6s}
  .landing.hide{opacity:0;pointer-events:none}
  .kicker{font-size:12px;letter-spacing:6px;color:#ff5a3c;font-weight:800;margin-bottom:16px}
  .landing h1{font-family:"STSong","SimSun",serif;font-size:44px;line-height:1.18;font-weight:700;letter-spacing:1px}
  .landing h1 em{font-style:normal;color:#ff5a3c}
  .landing p{margin-top:14px;font-size:14px;line-height:1.7;color:rgba(245,241,232,.62);max-width:330px}
  .cards{margin-top:34px;display:flex;flex-direction:column;gap:12px;max-width:380px}
  .card{position:relative;display:flex;align-items:center;justify-content:space-between;padding:18px 18px;border:1px solid rgba(245,241,232,.16);border-radius:16px;background:rgba(255,255,255,.045);backdrop-filter:blur(10px);cursor:pointer;transition:.25s}
  .card:hover{transform:translateY(-2px);border-color:rgba(255,90,60,.55);background:rgba(255,90,60,.08)}
  .card .t{font-size:17px;font-weight:800;letter-spacing:1px}
  .card .d{margin-top:4px;font-size:11px;color:rgba(245,241,232,.5);letter-spacing:1px}
  .card .price{font-size:12px;color:#ff5a3c;font-weight:800;white-space:nowrap;margin-left:12px}
  .credits{position:fixed;right:20px;bottom:14px;z-index:5;font-size:10px;letter-spacing:1px;color:rgba(245,241,232,.32)}
  .credits a{color:inherit;text-decoration:underline}
  .hud{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:22px 24px 26px;background:linear-gradient(transparent,rgba(7,7,11,.84));opacity:0;pointer-events:none;transition:opacity .6s}
  .hud.show{opacity:1;pointer-events:auto}
  .hud .h{font-family:"STSong","SimSun",serif;font-size:26px;line-height:1.35;letter-spacing:1px;text-shadow:0 2px 18px rgba(0,0,0,.5)}
  .hud .s{margin-top:8px;font-size:12px;line-height:1.7;color:rgba(245,241,232,.62);letter-spacing:1px;text-shadow:0 1px 10px rgba(0,0,0,.6)}
  .hud .row{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
  .btn{padding:9px 15px;border:1px solid rgba(245,241,232,.24);border-radius:99px;background:rgba(255,255,255,.06);color:#f5f1e8;font-size:12px;font-weight:700;letter-spacing:1px;cursor:pointer;transition:.2s}
  .btn:hover{border-color:#ff5a3c;color:#ff5a3c}
  .btn.primary{background:#ff5a3c;border-color:#ff5a3c;color:#120b09}
  .modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(4,4,8,.74);backdrop-filter:blur(6px)}
  .modal.show{display:flex}
  .modal .box{width:100%;max-width:340px;border:1px solid rgba(245,241,232,.16);border-radius:20px;background:#111118;padding:24px}
  .modal h3{font-size:18px;letter-spacing:1px}
  .modal p{margin-top:10px;font-size:12px;line-height:1.7;color:rgba(245,241,232,.55)}
  .modal input{margin-top:16px;width:100%;padding:12px 14px;border:1px solid rgba(245,241,232,.18);border-radius:10px;background:rgba(255,255,255,.04);color:#f5f1e8;font-size:15px;letter-spacing:2px;outline:none}
  .modal input:focus{border-color:#ff5a3c}
  .modal .actions{margin-top:14px;display:flex;gap:10px}
  .modal .actions .btn{flex:1;text-align:center}
  .toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:30;padding:12px 18px;border-radius:12px;background:rgba(17,17,24,.95);border:1px solid rgba(245,241,232,.18);font-size:13px;opacity:0;pointer-events:none;transition:.3s}
  .toast.show{opacity:1}
  .stamp{position:fixed;right:22px;top:18px;z-index:5;width:70px;height:84px;border:1px solid rgba(245,241,232,.30);border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;opacity:0;transition:.6s;transform:rotate(4deg);background:rgba(7,7,11,.18);backdrop-filter:blur(4px)}
  .stamp.show{opacity:.92}
  .stamp .city{font-size:11px;font-weight:800;letter-spacing:1px;text-align:center;line-height:1.3}
  .stamp .time{font-size:10px;color:#ff5a3c;font-weight:800}
  @media (min-width:700px){
    .landing{padding-left:8vw;padding-right:8vw}
    .landing h1{font-size:60px}
    .cards{max-width:460px}
  }
</style>
</head>
<body>
<div id="photo"></div>
<canvas id="scene"></canvas>
<div class="brand">五毛情绪铺</div>
<div class="credits">画面素材：Wikimedia Commons · <a href="credits.html" target="_blank">来源</a></div>
<div class="stamp" id="stamp"><div class="city" id="stampCity"></div><div class="time" id="stampTime"></div></div>

<div class="landing" id="landing">
  <div class="kicker">5 毛钱，买一次心动</div>
  <h1>今天，<br>想被<em>什么</em>哄一下？</h1>
  <p>不用出门，也不用做攻略。<br>选一个，剩下的交给我。</p>
  <div class="cards">
    <div class="card" data-scene="fireworks"><div><div class="t">为你放一场烟花</div><div class="d">30 秒 · 只属于你</div></div><div class="price">5 毛</div></div>
    <div class="card" data-scene="city"><div><div class="t">去世界某个角落</div><div class="d">随机一座城 · 此刻的样子</div></div><div class="price">5 毛</div></div>
    <div class="card" data-scene="snow"><div><div class="t">替你下一场初雪</div><div class="d">安静的 · 暖的</div></div><div class="price">5 毛</div></div>
  </div>
</div>

<div class="hud" id="hud">
  <div class="h" id="hudTitle"></div>
  <div class="s" id="hudSub"></div>
  <div class="row">
    <button class="btn primary" id="againBtn">再来一次</button>
    <button class="btn" id="backBtn">回到铺子</button>
    <button class="btn" id="soundBtn">声音：开</button>
  </div>
</div>

<div class="modal" id="startGate">
  <div class="box" style="text-align:center">
    <div class="kicker" style="margin-bottom:10px">你的 5 毛体验</div>
    <h3 id="gateTitle" style="font-size:30px;font-family:'STSong','SimSun',serif;letter-spacing:2px">烟花</h3>
    <p id="gateSub">轻触开始，给自己 30 秒。</p>
    <button class="btn primary" id="gateBtn" style="width:100%;margin-top:18px;padding:13px">开始</button>
  </div>
</div>

<div class="modal" id="modal">
  <div class="box">
    <h3>输入体验码</h3>
    <p>正式版下单后会自动收到体验码。演示版输入 <b>5毛</b> 即可解锁。</p>
    <input id="codeInput" placeholder="输入体验码" maxlength="12">
    <div class="actions"><button class="btn" id="cancelCode">再逛逛</button><button class="btn primary" id="okCode">解锁</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  const photo = document.getElementById('photo');
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  const landing = document.getElementById('landing');
  const hud = document.getElementById('hud');
  const hudTitle = document.getElementById('hudTitle');
  const hudSub = document.getElementById('hudSub');
  const againBtn = document.getElementById('againBtn');
  const backBtn = document.getElementById('backBtn');
  const soundBtn = document.getElementById('soundBtn');
  const modal = document.getElementById('modal');
  const codeInput = document.getElementById('codeInput');
  const toastEl = document.getElementById('toast');
  const stamp = document.getElementById('stamp');
  const stampCity = document.getElementById('stampCity');
  const stampTime = document.getElementById('stampTime');

  const LOCAL = location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.protocol === 'file:';
  const CDN = 'https://cdn.jsdelivr.net/gh/shuh82509-droid/wumao-emotion@v1/img/';
  const IMG = LOCAL
    ? { paris: 'img/paris.jpg', tokyo: 'img/tokyo.jpg', snow: 'img/snow.jpg', aurora: 'img/aurora.jpg', stars: 'img/stars.jpg' }
    : { paris: CDN + 'paris.jpg', tokyo: CDN + 'tokyo.jpg', snow: CDN + 'snow.jpg', aurora: CDN + 'aurora.jpg', stars: CDN + 'stars.jpg' };

  let W = 0, H = 0, dpr = 1;
  let scene = null, raf = 0, startAt = 0;
  let audioCtx = null, muted = false, master = null;

  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * dpr); canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (scene && scene.resize) scene.resize();
  }
  window.addEventListener('resize', resize);

  let photoToken = 0;
  function setPhoto(src, pos) {
    const t = ++photoToken;
    photo.classList.remove('on', 'kb');
    const img = new Image();
    img.onload = () => {
      if (t !== photoToken) return;
      photo.style.backgroundImage = `url("${src}")`;
      photo.style.backgroundPosition = pos || 'center';
      photo.style.transition = 'none';
      photo.style.opacity = '1';
      void photo.offsetWidth;
      photo.classList.add('on', 'kb');
    };
    img.src = src;
  }

  function ensureAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      master = audioCtx.createGain(); master.gain.value = 0.22; master.connect(audioCtx.destination);
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function boom() {
    if (muted) return;
    const ac = ensureAudio(), t = ac.currentTime;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(95, t); o.frequency.exponentialRampToValueAtTime(38, t + 0.35);
    g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
    o.connect(g).connect(master); o.start(t); o.stop(t + 0.65);
    const len = Math.floor(ac.sampleRate * 0.25), buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.2);
    const src = ac.createBufferSource(), bp = ac.createBiquadFilter(), ng = ac.createGain();
    bp.type = 'bandpass'; bp.frequency.value = 1800; bp.Q.value = 0.8; ng.gain.value = 0.25;
    src.buffer = buf; src.connect(bp).connect(ng).connect(master); src.start(t);
  }

  function wind() {
    if (muted) return;
    const ac = ensureAudio(), t = ac.currentTime;
    const len = Math.floor(ac.sampleRate * 2.4), buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * 0.5;
    const src = ac.createBufferSource(), lp = ac.createBiquadFilter(), g = ac.createGain();
    lp.type = 'lowpass'; lp.frequency.value = 480; g.gain.setValueAtTime(0.001, t);
    g.gain.linearRampToValueAtTime(0.15, t + 0.9); g.gain.linearRampToValueAtTime(0.001, t + 2.4);
    src.buffer = buf; src.connect(lp).connect(g).connect(master); src.start(t);
  }

  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(() => toastEl.classList.remove('show'), 1800);
  }

  function setHud(title, sub, againLabel) {
    hudTitle.textContent = title; hudSub.textContent = sub; againBtn.textContent = againLabel || '再来一次';
    hud.classList.add('show');
  }

  function resetCanvas() {
    cancelAnimationFrame(raf); raf = 0;
    ctx.clearRect(0, 0, W, H);
    photo.classList.remove('on', 'kb');
    photo.style.opacity = '0';
    document.body.dataset.scene = '';
    stamp.classList.remove('show');
  }

  function loop(fn) {
    startAt = performance.now();
    const tick = (now) => { fn(now - startAt); raf = requestAnimationFrame(tick); };
    raf = requestAnimationFrame(tick);
  }

  /* ---------------- fireworks over Tokyo ---------------- */
  function makeFireworks() {
    const parts = [], rockets = [];
    let last = 0;
    const HUES = [10, 26, 42, 350, 338, 20];
    const timers = [];
    const rand = (a, b) => a + Math.random() * (b - a);
    function shoot(tx, ty) {
      const x = tx ?? rand(W * 0.18, W * 0.82);
      const targetY = ty ?? rand(H * 0.12, H * 0.40);
      rockets.push({ x, y: H + 8, px: x, py: H + 8, tx: x + rand(-26, 26), ty: targetY, vy: -rand(8.5, 11.5), hue: HUES[Math.floor(Math.random() * HUES.length)] });
    }
    function explode(r) {
      const n = Math.floor(rand(90, 160));
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2, sp = rand(1.2, 5.8);
        parts.push({ x: r.tx, y: r.ty, px: r.tx, py: r.ty, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, decay: rand(0.008, 0.018), hue: r.hue + rand(-18, 18), w: rand(0.7, 1.8) });
      }
      boom();
    }
    function draw(t) {
      ctx.clearRect(0, 0, W, H);
      ctx.globalCompositeOperation = 'lighter';
      if (t - last > rand(620, 1050)) { shoot(); last = t; }
      for (let i = rockets.length - 1; i >= 0; i--) {
        const r = rockets[i];
        r.px = r.x; r.py = r.y;
        r.x += (r.tx - r.x) * 0.03; r.y += r.vy; r.vy += 0.06;
        ctx.strokeStyle = `hsla(${r.hue},95%,76%,.85)`; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(r.px, r.py); ctx.lineTo(r.x, r.y); ctx.stroke();
        if (r.y <= r.ty || r.vy >= 0) { explode(r); rockets.splice(i, 1); }
      }
      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i];
        p.px = p.x; p.py = p.y;
        p.vx *= 0.985; p.vy = p.vy * 0.985 + 0.055; p.x += p.vx; p.y += p.vy; p.life -= p.decay;
        if (p.life <= 0) { parts.splice(i, 1); continue; }
        ctx.strokeStyle = `hsla(${p.hue},95%,${58 + p.life * 18}%,${p.life})`;
        ctx.lineWidth = p.w * (0.6 + p.life * 0.8); ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(p.px, p.py); ctx.lineTo(p.x, p.y); ctx.stroke();
      }
      ctx.globalCompositeOperation = 'source-over';
    }
    function click(e) {
      const x = e.touches ? e.touches[0].clientX : e.clientX;
      const y = e.touches ? e.touches[0].clientY : e.clientY;
      shoot(x, Math.min(y, H * 0.55));
    }
    return {
      start() {
        setPhoto(IMG.tokyo, 'center 34%');
        document.body.dataset.scene = 'fireworks';
        last = 0; parts.length = 0; rockets.length = 0;
        window.addEventListener('pointerdown', click);
        setHud('这一场烟花，只为你放。', '点一下屏幕，会在你指尖炸开。', '再放一场');
        loop(draw);
        timers.push(setTimeout(() => { shoot(W * 0.32, H * 0.28); shoot(W * 0.68, H * 0.22); }, 500));
        timers.push(setTimeout(() => shoot(W * 0.5, H * 0.3), 1300));
      },
      stop() { window.removeEventListener('pointerdown', click); timers.forEach(clearTimeout); timers.length = 0; },
      resize() {},
    };
  }

  /* ---------------- city postcards ---------------- */
  const CITIES = [
    { name: '巴黎', country: '法国', tz: 'Europe/Paris', img: IMG.paris, pos: 'center 42%', line: '此刻的巴黎，铁塔刚醒。' },
    { name: '东京', country: '日本', tz: 'Asia/Tokyo', img: IMG.tokyo, pos: 'center 38%', line: '此刻的东京，还有一万盏灯没睡。' },
    { name: '雷克雅未克', country: '冰岛', tz: 'Atlantic/Reykjavik', img: IMG.aurora, pos: 'center 42%', line: '此刻的冰岛，极光正在头顶铺开。' },
    { name: '银河', country: '头顶', tz: '', noTime: true, img: IMG.stars, pos: 'center 45%', line: '此刻，银河在你头顶。' },
  ];

  function makeCity() {
    let city = null;
    function pick() {
      let next = city;
      while (CITIES.length > 1 && next === city) next = CITIES[Math.floor(Math.random() * CITIES.length)];
      city = next;
      setPhoto(city.img, city.pos);
      document.body.dataset.scene = 'city';
      const now = city.noTime
        ? '此刻'
        : new Intl.DateTimeFormat('zh-CN', { timeZone: city.tz, hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date());
      stampCity.textContent = city.name; stampTime.textContent = now;
      stamp.classList.add('show');
      setHud(city.name + ' · ' + city.country, city.line, '换一座城');
    }
    return {
      start() { pick(); wind(); },
      stop() {},
      resize() {},
      again() { pick(); },
    };
  }

  /* ---------------- first snow ---------------- */
  function makeSnow() {
    const flakes = [];
    function init() {
      flakes.length = 0;
      const n = Math.floor(W * H / 8500);
      for (let i = 0; i < n; i++) flakes.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 2.4 + 0.6, vy: Math.random() * 0.7 + 0.3, vx: Math.random() * 0.3 - 0.15, p: Math.random() * Math.PI * 2 });
    }
    function draw(t) {
      ctx.clearRect(0, 0, W, H);
      ctx.globalCompositeOperation = 'lighter';
      for (const f of flakes) {
        f.p += 0.01; f.x += f.vx + Math.sin(f.p) * 0.3; f.y += f.vy;
        if (f.y > H + 4) { f.y = -4; f.x = Math.random() * W; }
        if (f.x > W + 4) f.x = -4; if (f.x < -4) f.x = W + 4;
        ctx.fillStyle = `rgba(255,255,255,${0.35 + f.r / 6})`;
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
    }
    return {
      start() {
        setPhoto(IMG.snow, 'center 48%');
        document.body.dataset.scene = 'snow';
        init(); wind();
        setHud('今年的第一场雪，替你下了。', '不用出门，也不用等天气。', '再下一场');
        loop(draw);
      },
      stop() {},
      resize() { init(); },
    };
  }

  const scenes = { fireworks: makeFireworks(), city: makeCity(), snow: makeSnow() };

  function enter(name) {
    ensureAudio();
    if (scene) scene.stop();
    resetCanvas();
    landing.classList.add('hide');
    hud.classList.remove('show');
    scene = scenes[name]; scene.start(); scene._name = name;
  }

  function back() {
    if (scene) scene.stop();
    scene = null; resetCanvas();
    hud.classList.remove('show');
    landing.classList.remove('hide');
  }

  document.querySelectorAll('.card').forEach((el) => el.addEventListener('click', () => enter(el.dataset.scene)));
  backBtn.addEventListener('click', back);
  againBtn.addEventListener('click', () => {
    if (scene && scene.again) scene.again();
    else if (scene) { scene.stop(); resetCanvas(); scene.start(); }
  });
  soundBtn.addEventListener('click', () => { muted = !muted; soundBtn.textContent = '声音：' + (muted ? '关' : '开'); if (master) master.gain.value = muted ? 0 : 0.22; });

  window.addEventListener('keydown', (e) => { if (e.key === 'Escape') back(); });

  const params = new URLSearchParams(location.search);
  const initialScene = params.get('scene');
  if (params.get('clean') === '1') {
    document.querySelector('.brand').style.display = 'none';
    hud.style.display = 'none';
    stamp.style.display = 'none';
    document.querySelector('.credits').style.display = 'none';
  }
  const sceneNames = { fireworks: '为你放一场烟花', city: '去世界某个角落', snow: '替你下一场初雪' };
  if (initialScene && sceneNames[initialScene]) {
    const pre = initialScene === 'city' ? [IMG.paris, IMG.tokyo, IMG.aurora, IMG.stars] : initialScene === 'snow' ? [IMG.snow] : [IMG.tokyo];
    pre.forEach((src) => { const i = new Image(); i.src = src; });
    document.getElementById('gateTitle').textContent = sceneNames[initialScene];
    document.getElementById('startGate').classList.add('show');
    document.getElementById('gateBtn').addEventListener('click', () => {
      document.getElementById('startGate').classList.remove('show');
      enter(initialScene);
    });
  }
  document.addEventListener('pointerdown', () => {
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }, { once: true });

  resize();
})();
</script>
</body>
</html>
