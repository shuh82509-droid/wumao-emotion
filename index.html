<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>五毛情绪铺</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#07070b;color:#f5f1e8;font-family:"Microsoft YaHei","PingFang SC",sans-serif}
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block}
  .brand{position:fixed;left:22px;top:18px;z-index:5;font-size:12px;letter-spacing:3px;color:rgba(245,241,232,.55);font-weight:700}
  .brand b{color:#ff5a3c}
  .landing{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;justify-content:center;padding:0 26px;background:radial-gradient(120% 80% at 50% 0%,rgba(38,28,60,.55),rgba(7,7,11,.2) 55%,rgba(7,7,11,.9));transition:opacity .6s}
  .landing.hide{opacity:0;pointer-events:none}
  .kicker{font-size:12px;letter-spacing:6px;color:#ff5a3c;font-weight:800;margin-bottom:16px}
  .landing h1{font-family:"STSong","SimSun",serif;font-size:44px;line-height:1.18;font-weight:700;letter-spacing:1px}
  .landing h1 em{font-style:normal;color:#ff5a3c}
  .landing p{margin-top:14px;font-size:14px;line-height:1.7;color:rgba(245,241,232,.62);max-width:330px}
  .cards{margin-top:34px;display:flex;flex-direction:column;gap:12px;max-width:380px}
  .card{position:relative;display:flex;align-items:center;justify-content:space-between;padding:18px 18px;border:1px solid rgba(245,241,232,.16);border-radius:16px;background:rgba(255,255,255,.045);backdrop-filter:blur(10px);cursor:pointer;transition:.25s}
  .card:hover{transform:translateY(-2px);border-color:rgba(255,90,60,.55);background:rgba(255,90,60,.08)}
  .card .t{font-size:17px;font-weight:800;letter-spacing:1px}
  .card .d{margin-top:4px;font-size:11px;color:rgba(245,241,232,.5);letter-spacing:1px}
  .card .price{font-size:12px;color:#ff5a3c;font-weight:800;white-space:nowrap;margin-left:12px}
  .demo{position:fixed;left:22px;bottom:16px;z-index:5;font-size:10px;letter-spacing:2px;color:rgba(245,241,232,.35)}
  .hud{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:22px 24px 26px;background:linear-gradient(transparent,rgba(7,7,11,.82));opacity:0;pointer-events:none;transition:opacity .6s}
  .hud.show{opacity:1;pointer-events:auto}
  .hud .h{font-family:"STSong","SimSun",serif;font-size:26px;line-height:1.35;letter-spacing:1px}
  .hud .s{margin-top:8px;font-size:12px;line-height:1.7;color:rgba(245,241,232,.55);letter-spacing:1px}
  .hud .row{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
  .btn{padding:9px 15px;border:1px solid rgba(245,241,232,.22);border-radius:99px;background:rgba(255,255,255,.05);color:#f5f1e8;font-size:12px;font-weight:700;letter-spacing:1px;cursor:pointer;transition:.2s}
  .btn:hover{border-color:#ff5a3c;color:#ff5a3c}
  .btn.primary{background:#ff5a3c;border-color:#ff5a3c;color:#120b09}
  .modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(4,4,8,.72);backdrop-filter:blur(6px)}
  .modal.show{display:flex}
  .modal .box{width:100%;max-width:340px;border:1px solid rgba(245,241,232,.16);border-radius:20px;background:#111118;padding:24px}
  .modal h3{font-size:18px;letter-spacing:1px}
  .modal p{margin-top:10px;font-size:12px;line-height:1.7;color:rgba(245,241,232,.55)}
  .modal input{margin-top:16px;width:100%;padding:12px 14px;border:1px solid rgba(245,241,232,.18);border-radius:10px;background:rgba(255,255,255,.04);color:#f5f1e8;font-size:15px;letter-spacing:2px;outline:none}
  .modal input:focus{border-color:#ff5a3c}
  .modal .actions{margin-top:14px;display:flex;gap:10px}
  .modal .actions .btn{flex:1;text-align:center}
  .toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:30;padding:12px 18px;border-radius:12px;background:rgba(17,17,24,.95);border:1px solid rgba(245,241,232,.18);font-size:13px;opacity:0;pointer-events:none;transition:.3s}
  .toast.show{opacity:1}
  .stamp{position:fixed;right:22px;top:18px;z-index:5;width:64px;height:78px;border:1px solid rgba(245,241,232,.28);border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;opacity:0;transition:.6s;transform:rotate(4deg)}
  .stamp.show{opacity:.9}
  .stamp .city{font-size:11px;font-weight:800;letter-spacing:1px;text-align:center;line-height:1.3}
  .stamp .time{font-size:10px;color:#ff5a3c;font-weight:800}
  @media (min-width:700px){
    .landing{padding-left:8vw;padding-right:8vw}
    .landing h1{font-size:60px}
    .cards{max-width:460px}
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="brand">五毛情绪铺</div>
<div class="stamp" id="stamp"><div class="city" id="stampCity"></div><div class="time" id="stampTime"></div></div>

<div class="landing" id="landing">
  <div class="kicker">5 毛钱，买一次心动</div>
  <h1>今天，<br>想被<em>什么</em>哄一下？</h1>
  <p>不用出门，也不用做攻略。<br>选一个，剩下的交给我。</p>
  <div class="cards">
    <div class="card" data-scene="fireworks"><div><div class="t">为你放一场烟花</div><div class="d">30 秒 · 只属于你</div></div><div class="price">5 毛</div></div>
    <div class="card" data-scene="city"><div><div class="t">去世界某个角落</div><div class="d">随机一座城 · 此刻的样子</div></div><div class="price">5 毛</div></div>
    <div class="card" data-scene="snow"><div><div class="t">替你下一场初雪</div><div class="d">安静的 · 暖的</div></div><div class="price">5 毛</div></div>
  </div>
</div>

<div class="hud" id="hud">
  <div class="h" id="hudTitle"></div>
  <div class="s" id="hudSub"></div>
  <div class="row">
    <button class="btn primary" id="againBtn">再来一次</button>
    <button class="btn" id="backBtn">回到铺子</button>
    <button class="btn" id="soundBtn">声音：开</button>
  </div>
</div>

<div class="modal" id="startGate">
  <div class="box" style="text-align:center">
    <div class="kicker" style="margin-bottom:10px">你的 5 毛体验</div>
    <h3 id="gateTitle" style="font-size:30px;font-family:'STSong','SimSun',serif;letter-spacing:2px">烟花</h3>
    <p id="gateSub">轻触开始，给自己 30 秒。</p>
    <button class="btn primary" id="gateBtn" style="width:100%;margin-top:18px;padding:13px">开始</button>
  </div>
</div>

<div class="modal" id="modal">
  <div class="box">
    <h3>输入体验码</h3>
    <p>正式版下单后会自动收到体验码。演示版输入 <b>5毛</b> 即可解锁。</p>
    <input id="codeInput" placeholder="输入体验码" maxlength="12">
    <div class="actions"><button class="btn" id="cancelCode">再逛逛</button><button class="btn primary" id="okCode">解锁</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  const landing = document.getElementById('landing');
  const hud = document.getElementById('hud');
  const hudTitle = document.getElementById('hudTitle');
  const hudSub = document.getElementById('hudSub');
  const againBtn = document.getElementById('againBtn');
  const backBtn = document.getElementById('backBtn');
  const soundBtn = document.getElementById('soundBtn');
  const modal = document.getElementById('modal');
  const codeInput = document.getElementById('codeInput');
  const toastEl = document.getElementById('toast');
  const stamp = document.getElementById('stamp');
  const stampCity = document.getElementById('stampCity');
  const stampTime = document.getElementById('stampTime');

  let W = 0, H = 0, dpr = 1;
  let scene = null, raf = 0, startAt = 0;
  let audioCtx = null, muted = false, master = null;
  let stars = [];

  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * dpr); canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    initStars();
    if (scene) scene.resize && scene.resize();
  }
  window.addEventListener('resize', resize);

  function initStars() {
    stars = Array.from({ length: Math.min(180, Math.floor(W * H / 9000)) }, () => ({
      x: Math.random() * W, y: Math.random() * H * 0.75, r: Math.random() * 1.3 + 0.2, p: Math.random() * Math.PI * 2,
    }));
  }

  function drawStars(t, alpha = 1) {
    for (const s of stars) {
      const a = (0.25 + 0.35 * (0.5 + 0.5 * Math.sin(t * 0.001 + s.p))) * alpha;
      ctx.fillStyle = `rgba(255,255,255,${a})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
  }

  function ensureAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      master = audioCtx.createGain(); master.gain.value = 0.22; master.connect(audioCtx.destination);
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function boom() {
    if (muted) return;
    const ac = ensureAudio(), t = ac.currentTime;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(95, t); o.frequency.exponentialRampToValueAtTime(38, t + 0.35);
    g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
    o.connect(g).connect(master); o.start(t); o.stop(t + 0.65);
    const len = Math.floor(ac.sampleRate * 0.25), buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.2);
    const src = ac.createBufferSource(), bp = ac.createBiquadFilter(), ng = ac.createGain();
    bp.type = 'bandpass'; bp.frequency.value = 1800; bp.Q.value = 0.8; ng.gain.value = 0.25;
    src.buffer = buf; src.connect(bp).connect(ng).connect(master); src.start(t);
  }

  function wind() {
    if (muted) return;
    const ac = ensureAudio(), t = ac.currentTime;
    const len = Math.floor(ac.sampleRate * 2.2), buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * 0.5;
    const src = ac.createBufferSource(), lp = ac.createBiquadFilter(), g = ac.createGain();
    lp.type = 'lowpass'; lp.frequency.value = 520; g.gain.setValueAtTime(0.001, t);
    g.gain.linearRampToValueAtTime(0.16, t + 0.8); g.gain.linearRampToValueAtTime(0.001, t + 2.2);
    src.buffer = buf; src.connect(lp).connect(g).connect(master); src.start(t);
  }

  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(() => toastEl.classList.remove('show'), 1800);
  }

  function setHud(title, sub, againLabel) {
    hudTitle.textContent = title; hudSub.textContent = sub; againBtn.textContent = againLabel || '再来一次';
    hud.classList.add('show');
  }

  function resetCanvas() {
    cancelAnimationFrame(raf); raf = 0;
    ctx.globalCompositeOperation = 'source-over';
    ctx.clearRect(0, 0, W, H);
    stamp.classList.remove('show');
  }

  function loop(fn) {
    startAt = performance.now();
    const tick = (now) => { fn(now - startAt); raf = requestAnimationFrame(tick); };
    raf = requestAnimationFrame(tick);
  }

  /* ---------------- fireworks ---------------- */
  function makeFireworks() {
    const parts = [], rockets = [];
    let last = 0, hue = 0;
    const rand = (a, b) => a + Math.random() * (b - a);

    function shoot(tx, ty) {
      const x = tx ?? rand(W * 0.18, W * 0.82);
      const targetY = ty ?? rand(H * 0.12, H * 0.42);
      rockets.push({ x, y: H + 8, tx: x + rand(-30, 30), ty: targetY, vy: -rand(8.5, 11.5), hue: hue = (hue + rand(35, 95)) % 360, trail: [] });
    }
    function explode(r) {
      const n = Math.floor(rand(80, 150));
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2, sp = rand(1.2, 5.8);
        parts.push({ x: r.tx, y: r.ty, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, decay: rand(0.008, 0.018), hue: r.hue + rand(-18, 18), size: rand(0.7, 2.1) });
      }
      boom();
    }
    function draw(t) {
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = 'rgba(7,7,11,0.20)'; ctx.fillRect(0, 0, W, H);
      drawStars(t, 0.9);
      ctx.globalCompositeOperation = 'lighter';
      if (t - last > rand(620, 1050)) { shoot(); last = t; }
      for (let i = rockets.length - 1; i >= 0; i--) {
        const r = rockets[i]; r.trail.push({ x: r.x, y: r.y }); if (r.trail.length > 8) r.trail.shift();
        r.x += (r.tx - r.x) * 0.03; r.y += r.vy; r.vy += 0.06;
        for (const p of r.trail) { ctx.fillStyle = `hsla(${r.hue},90%,70%,.35)`; ctx.beginPath(); ctx.arc(p.x, p.y, 1.6, 0, Math.PI * 2); ctx.fill(); }
        ctx.fillStyle = `hsl(${r.hue},95%,78%)`; ctx.beginPath(); ctx.arc(r.x, r.y, 2.4, 0, Math.PI * 2); ctx.fill();
        if (r.y <= r.ty || r.vy >= 0) { explode(r); rockets.splice(i, 1); }
      }
      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i];
        p.vx *= 0.985; p.vy = p.vy * 0.985 + 0.055; p.x += p.vx; p.y += p.vy; p.life -= p.decay;
        if (p.life <= 0) { parts.splice(i, 1); continue; }
        ctx.fillStyle = `hsla(${p.hue},95%,${55 + p.life * 20}%,${p.life})`;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.6 + p.life * 0.8), 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
    }
    function click(e) {
      const x = e.touches ? e.touches[0].clientX : e.clientX;
      const y = e.touches ? e.touches[0].clientY : e.clientY;
      shoot(x, Math.min(y, H * 0.55));
    }
    return {
      start() {
        initStars(); last = 0; parts.length = 0; rockets.length = 0;
        window.addEventListener('pointerdown', click);
        setHud('这一场烟花，只为你放。', '点一下屏幕，会在你指尖炸开。', '再放一场');
        loop(draw);
      },
      stop() { window.removeEventListener('pointerdown', click); },
      resize() {},
    };
  }

  /* ---------------- city ---------------- */
  const CITIES = [
    { name: '雷克雅未克', country: '冰岛', tz: 'Atlantic/Reykjavik', sky: ['#081426', '#123a55'], accent: '#8fe3c8', land: '#050b12', line: '此刻的冰岛，风把云吹得很慢。', kind: 'aurora' },
    { name: '东京', country: '日本', tz: 'Asia/Tokyo', sky: ['#1a0d24', '#4a1830'], accent: '#ff7a9c', land: '#0c0610', line: '此刻的东京，有人刚下班，有人刚醒来。', kind: 'city', tower: true },
    { name: '巴黎', country: '法国', tz: 'Europe/Paris', sky: ['#0d1730', '#384a70'], accent: '#ffd27a', land: '#080b14', line: '此刻的巴黎，塞纳河把灯光揉碎了。', kind: 'city', eiffel: true },
    { name: '伊斯坦布尔', country: '土耳其', tz: 'Europe/Istanbul', sky: ['#1c1024', '#5b2b2a'], accent: '#ffb36b', land: '#0c0709', line: '此刻的伊斯坦布尔，宣礼声刚掠过屋顶。', kind: 'domes' },
    { name: '大理', country: '中国', tz: 'Asia/Shanghai', sky: ['#0b1b2e', '#2d5a63'], accent: '#a8e6cf', land: '#060c10', line: '此刻的大理，苍山把云放在了肩上。', kind: 'mountains' },
    { name: '威尼斯', country: '意大利', tz: 'Europe/Rome', sky: ['#160f22', '#57324a'], accent: '#ffc48a', land: '#0a070d', line: '此刻的威尼斯，水把整座城轻轻晃着。', kind: 'water' },
    { name: '特罗姆瑟', country: '挪威', tz: 'Europe/Oslo', sky: ['#06101f', '#12334a'], accent: '#9db8ff', land: '#04080d', line: '此刻的特罗姆瑟，极光正在头顶铺开。', kind: 'aurora2' },
    { name: '纽约', country: '美国', tz: 'America/New_York', sky: ['#0b1020', '#2b2f52'], accent: '#ffd166', land: '#05060b', line: '此刻的纽约，有一万盏灯还醒着。', kind: 'city', nyt: true },
  ];

  function makeCity() {
    let city = null, phase = 0, cloud = 0;
    function pick() {
      let next = city; while (CITIES.length > 1 && next === city) next = CITIES[Math.floor(Math.random() * CITIES.length)];
      city = next;
      const now = new Intl.DateTimeFormat('zh-CN', { timeZone: city.tz, hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date());
      stampCity.textContent = city.name; stampTime.textContent = now;
      stamp.classList.add('show');
      setHud(city.name + ' · ' + city.country, city.line, '换一座城');
    }
    function skyline(baseY, color, seed) {
      ctx.fillStyle = color; let x = -20; let r = seed;
      const rnd = () => { r = (r * 9301 + 49297) % 233280; return r / 233280; };
      while (x < W + 20) {
        const w = 18 + rnd() * 52, h = 30 + rnd() * 150;
        ctx.fillRect(x, baseY - h, w, h + 300);
        if (rnd() > 0.45) {
          ctx.fillStyle = 'rgba(255,220,160,.5)';
          for (let yy = baseY - h + 12; yy < baseY - 8; yy += 18) for (let xx = x + 6; xx < x + w - 6; xx += 14) if (rnd() > 0.55) ctx.fillRect(xx, yy, 3, 5);
          ctx.fillStyle = color;
        }
        x += w + 4 + rnd() * 8;
      }
    }
    function auroraBands(t, col1, col2) {
      for (let k = 0; k < 3; k++) {
        ctx.beginPath();
        for (let x = 0; x <= W; x += 8) {
          const y = H * 0.18 + k * 36 + Math.sin(x * 0.006 + t * 0.0004 + k) * 42 + Math.sin(x * 0.013 - t * 0.0002) * 18;
          x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.strokeStyle = k % 2 ? col2 : col1; ctx.lineWidth = 26 - k * 5; ctx.globalAlpha = 0.16; ctx.stroke(); ctx.globalAlpha = 1;
      }
    }
    function draw(t) {
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, city.sky[0]); g.addColorStop(1, city.sky[1]);
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      drawStars(t, 0.55);
      ctx.fillStyle = 'rgba(255,236,200,.9)'; ctx.beginPath(); ctx.arc(W * 0.74, H * 0.2, 26, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,236,200,.12)'; ctx.beginPath(); ctx.arc(W * 0.74, H * 0.2, 60, 0, Math.PI * 2); ctx.fill();
      cloud += 0.12;
      for (let i = 0; i < 3; i++) {
        ctx.fillStyle = 'rgba(255,255,255,.035)';
        const cx = ((cloud + i * 220) % (W + 360)) - 180;
        ctx.beginPath(); ctx.ellipse(cx, H * 0.28 + i * 26, 150, 26, 0, 0, Math.PI * 2); ctx.fill();
      }
      const baseY = H * 0.72;
      if (city.kind === 'aurora' || city.kind === 'aurora2') auroraBands(t, city.accent, '#b79cff');
      if (city.kind === 'aurora' || city.kind === 'aurora2' || city.kind === 'mountains') {
        ctx.fillStyle = city.land;
        ctx.beginPath(); ctx.moveTo(0, baseY);
        for (let x = 0; x <= W; x += 20) ctx.lineTo(x, baseY - 70 - Math.sin(x * 0.008 + 1) * 90 - Math.sin(x * 0.021) * 30);
        ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.10)';
        ctx.beginPath(); ctx.moveTo(0, baseY - 20); for (let x = 0; x <= W; x += 24) ctx.lineTo(x, baseY - 70 - Math.sin(x * 0.008 + 1) * 88); ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();
      } else if (city.kind === 'domes') {
        ctx.fillStyle = city.land; ctx.fillRect(0, baseY, W, H - baseY);
        for (let i = 0; i < 4; i++) {
          const x = W * (0.12 + i * 0.24), r = 48 + (i % 2) * 22;
          ctx.beginPath(); ctx.arc(x, baseY, r, Math.PI, 0); ctx.fill();
          ctx.fillRect(x - 5, baseY - r - 55, 10, 55);
          ctx.beginPath(); ctx.arc(x, baseY - r - 62, 7, 0, Math.PI * 2); ctx.fill();
        }
      } else if (city.kind === 'water') {
        skyline(baseY - 30, city.land, 7);
        ctx.fillStyle = 'rgba(10,10,20,.45)'; ctx.fillRect(0, baseY + 100, W, H - baseY - 100);
        for (let i = 0; i < 30; i++) {
          ctx.fillStyle = `rgba(255,200,140,${0.05 + Math.random() * 0.08})`;
          ctx.fillRect(Math.random() * W, baseY + 110 + Math.random() * (H - baseY - 130), 30 + Math.random() * 80, 2);
        }
      } else {
        skyline(baseY, city.land, city.tower ? 11 : city.eiffel ? 23 : 31);
        if (city.eiffel) {
          ctx.strokeStyle = city.land; ctx.lineWidth = 6;
          ctx.beginPath(); ctx.moveTo(W * 0.5, baseY - 230); ctx.lineTo(W * 0.45, baseY); ctx.moveTo(W * 0.5, baseY - 230); ctx.lineTo(W * 0.55, baseY); ctx.stroke();
          ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(W * 0.47, baseY - 120); ctx.lineTo(W * 0.53, baseY - 120); ctx.moveTo(W * 0.48, baseY - 70); ctx.lineTo(W * 0.52, baseY - 70); ctx.stroke();
        }
        if (city.tower) {
          ctx.fillStyle = '#ff4d4d'; ctx.fillRect(W * 0.62, baseY - 200, 10, 200);
          ctx.fillStyle = 'rgba(255,77,77,.25)'; ctx.beginPath(); ctx.arc(W * 0.625, baseY - 200, 18, 0, Math.PI * 2); ctx.fill();
        }
        if (city.nyt) {
          ctx.fillStyle = city.land; ctx.fillRect(W * 0.31, baseY - 240, 26, 240);
          ctx.beginPath(); ctx.moveTo(W * 0.31, baseY - 240); ctx.lineTo(W * 0.323, baseY - 280); ctx.lineTo(W * 0.336, baseY - 240); ctx.fill();
        }
      }
      const v = ctx.createLinearGradient(0, H * 0.72, 0, H);
      v.addColorStop(0, 'rgba(7,7,11,0)'); v.addColorStop(1, 'rgba(7,7,11,.85)');
      ctx.fillStyle = v; ctx.fillRect(0, H * 0.7, W, H * 0.3);
    }
    return {
      start() { pick(); wind(); loop(draw); },
      stop() {},
      resize() {},
      again() { pick(); },
    };
  }

  /* ---------------- snow ---------------- */
  function makeSnow() {
    const flakes = [];
    function init() { flakes.length = 0; const n = Math.floor(W * H / 9000); for (let i = 0; i < n; i++) flakes.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 2.2 + 0.5, vy: Math.random() * 0.6 + 0.25, vx: Math.random() * 0.3 - 0.15, p: Math.random() * Math.PI * 2 }); }
    function draw(t) {
      const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0a1220'); g.addColorStop(1, '#1a2436');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      drawStars(t, 0.25);
      const wx = W * 0.5, wy = H * 0.52, ww = Math.min(W * 0.62, 360), wh = ww * 0.52;
      const glow = ctx.createRadialGradient(wx, wy, 10, wx, wy, ww * 0.9);
      glow.addColorStop(0, 'rgba(255,176,92,.30)'); glow.addColorStop(1, 'rgba(255,176,92,0)');
      ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(wx, wy, ww * 0.9, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1b120c'; ctx.fillRect(wx - ww / 2 - 14, wy - wh / 2 - 14, ww + 28, wh + 28);
      const wg = ctx.createLinearGradient(wx, wy - wh / 2, wx, wy + wh / 2); wg.addColorStop(0, '#ffcf8a'); wg.addColorStop(1, '#ff7a3c');
      ctx.fillStyle = wg; ctx.fillRect(wx - ww / 2, wy - wh / 2, ww, wh);
      ctx.strokeStyle = '#1b120c'; ctx.lineWidth = 10;
      ctx.beginPath(); ctx.moveTo(wx, wy - wh / 2); ctx.lineTo(wx, wy + wh / 2); ctx.moveTo(wx - ww / 2, wy); ctx.lineTo(wx + ww / 2, wy); ctx.stroke();
      for (const f of flakes) {
        f.p += 0.01; f.x += f.vx + Math.sin(f.p) * 0.25; f.y += f.vy;
        if (f.y > H + 4) { f.y = -4; f.x = Math.random() * W; }
        if (f.x > W + 4) f.x = -4; if (f.x < -4) f.x = W + 4;
        ctx.fillStyle = `rgba(255,255,255,${0.35 + f.r / 6})`;
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill();
      }
      const v = ctx.createLinearGradient(0, H * 0.7, 0, H); v.addColorStop(0, 'rgba(7,7,11,0)'); v.addColorStop(1, 'rgba(7,7,11,.82)');
      ctx.fillStyle = v; ctx.fillRect(0, H * 0.7, W, H * 0.3);
    }
    return { start() { init(); wind(); setHud('今年的第一场雪，替你下了。', '不用出门，也不用等天气。', '再下一场'); loop(draw); }, stop() {}, resize() { init(); } };
  }

  const scenes = { fireworks: makeFireworks(), city: makeCity(), snow: makeSnow() };

  function enter(name) {
    ensureAudio();
    if (scene) scene.stop();
    resetCanvas();
    landing.classList.add('hide');
    hud.classList.remove('show');
    scene = scenes[name]; scene.start(); scene._name = name;
  }

  function back() {
    if (scene) scene.stop();
    scene = null; resetCanvas();
    hud.classList.remove('show'); stamp.classList.remove('show');
    landing.classList.remove('hide');
  }

  document.querySelectorAll('.card').forEach((el) => el.addEventListener('click', () => enter(el.dataset.scene)));
  backBtn.addEventListener('click', back);
  againBtn.addEventListener('click', () => { if (scene && scene.again) scene.again(); else if (scene && scene._name === 'fireworks') { /* loop continues */ } else if (scene) { scene.stop(); resetCanvas(); scene.start(); } });
  soundBtn.addEventListener('click', () => { muted = !muted; soundBtn.textContent = '声音：' + (muted ? '关' : '开'); if (master) master.gain.value = muted ? 0 : 0.22; });

  window.addEventListener('keydown', (e) => { if (e.key === 'Escape') back(); });

  const params = new URLSearchParams(location.search);
  const initialScene = params.get('scene');
  if (params.get('clean') === '1') {
    document.querySelector('.brand').style.display = 'none';
    hud.style.display = 'none';
    stamp.style.display = 'none';
  }
  const sceneNames = { fireworks: '为你放一场烟花', city: '去世界某个角落', snow: '替你下一场初雪' };
  if (initialScene && sceneNames[initialScene]) {
    document.getElementById('gateTitle').textContent = sceneNames[initialScene];
    document.getElementById('startGate').classList.add('show');
    document.getElementById('gateBtn').addEventListener('click', () => {
      document.getElementById('startGate').classList.remove('show');
      enter(initialScene);
    });
  }
  document.addEventListener('pointerdown', () => {
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }, { once: true });

  resize();
  // 演示版直接进入，不需要体验码；保留入口给正式版
  setTimeout(() => { landing.querySelector('h1').style.opacity = 1; }, 100);
})();
</script>
</body>
